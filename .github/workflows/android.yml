# בונה APK חתום של "קוראים בכיף" ומפרסם אותו בעמוד ההורדות (Releases).
# רץ בכל העלאה לענף main, או בלחיצה ידנית (Actions ← Build APK ← Run workflow).
name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: בדיקת מפתח החתימה
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
          KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASS }}
        run: |
          P="$(printf '%s' "$KEYSTORE_PASS" | tr -d ' \r\n\t')"
          if [ -z "$P" ]; then echo "::error::חסר הסוד KEYSTORE_PASS"; exit 1; fi
          echo "::add-mask::$P"
          K="$RUNNER_TEMP/release.jks"
          # המפתח שמור בפרויקט מוצפן – נפתח רק עם הסיסמה מהסודות
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -in android/kriah-release.jks.enc -out "$K" -pass pass:"$P" 2>/dev/null || true
          if ! keytool -list -keystore "$K" -storepass "$P" >/dev/null 2>&1; then
            printf '%s' "$KEYSTORE_B64" | tr -d ' \r\n\t' | base64 -d > "$K" 2>/dev/null || true
          fi
          keytool -list -keystore "$K" -storepass "$P" >/dev/null 2>&1 || { echo "::error::הסיסמה KEYSTORE_PASS לא נכונה – צריך להדביק אותה שוב בסודות"; exit 1; }
          echo "KS_PASS=$P" >> "$GITHUB_ENV"
          echo "::notice::מפתח החתימה תקין"
      - run: npm ci || npm install
      - name: גרסה
        id: ver
        run: |
          V=$(jq -r .version version.json)
          echo "v=$V" >> "$GITHUB_OUTPUT"
          sed -i "s/__APP_VERSION__/$V/g" www/index.html
      - run: npx cap sync android
      - name: בניית APK חתום
        working-directory: android
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/release.jks
          KEYSTORE_PASS: ${{ env.KS_PASS }}
          VERSION_NAME: ${{ steps.ver.outputs.v }}
          VERSION_CODE: ${{ github.run_number }}
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew assembleRelease --no-daemon --stacktrace 2>&1 | tee "$RUNNER_TEMP/gradle.log" || { M=$(grep -v "^\s*$" "$RUNNER_TEMP/gradle.log" | grep -B30 -A12 "What went wrong" | head -60 | sed ':a;N;$!ba;s/%/%25/g;s/\r//g;s/\n/%0A/g'); echo "::error title=gradle::$M"; exit 1; }
      - name: שם הקובץ
        run: cp android/app/build/outputs/apk/release/app-release.apk kriah-befun.apk
      - name: פרסום בעמוד ההורדות
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.v }}
          name: קוראים בכיף ${{ steps.ver.outputs.v }}
          body_path: RELEASE_NOTES.md
          files: kriah-befun.apk
          make_latest: true
